name: Verify Tarangini

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:review
