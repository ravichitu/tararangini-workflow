<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Status | Tarangini</title>
  <style>
    :root { color-scheme:light; --ink:#102a3b; --muted:#5b7180; --line:#d9e4e9; --accent:#087f86; --ok:#16844b; --bad:#c9362b; --paper:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f8fa; color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); margin:auto; padding:18px; }
    header,.card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
    header { border-top:5px solid var(--accent); }
    h1,h2,p,h3 { margin-top:0; }
    h1 { font-size:24px; margin-bottom:4px; }
    h2 { font-size:17px; }
    .muted,small { color:var(--muted); }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    .summary div { background:#f3f8fa; padding:10px; border-radius:9px; }
    .summary strong,.summary span { display:block; }
    .status { color:var(--accent); font-weight:800; }
    .item,.addition,.event,.attachment { padding:12px 0; border-bottom:1px solid var(--line); }
    .item:last-child,.addition:last-child,.event:last-child,.attachment:last-child { border-bottom:0; }
    .addition.awaiting { border-left:4px solid #e99a1a; padding-left:12px; }
    label { display:block; font-weight:700; margin:10px 0 5px; }
    input,select,textarea,button { width:100%; font:inherit; border:1px solid var(--line); border-radius:8px; padding:11px; }
    textarea { min-height:80px; }
    button { border:0; background:var(--accent); color:#fff; font-weight:800; cursor:pointer; margin-top:9px; }
    button.reject { background:var(--bad); }
    .button-link { display:inline-block; width:auto; text-decoration:none; padding:10px 14px; border-radius:8px; background:#e8f5f6; color:var(--accent); font-weight:700; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .message { padding:12px; border-radius:8px; background:#eaf7ef; color:var(--ok); margin-bottom:12px; }
    .error { background:#fff0ef; color:var(--bad); }
    .tag-row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    .tag { padding:6px 10px; border-radius:999px; background:#edf7f8; color:var(--accent); font-size:12px; font-weight:700; }
    .attachment-preview { display:block; width:100%; max-height:280px; object-fit:contain; margin:10px 0; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .upload-note { margin-top:8px; }
    .preview-frame { width:100%; min-height:70vh; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .preview-modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(7,24,35,.7); z-index:20; }
    .preview-modal.open { display:flex; }
    .preview-box { width:min(980px,100%); max-height:94vh; overflow:auto; background:#fff; border-radius:16px; padding:16px; }
    @media (max-width:560px) { main { padding:10px; } .summary { grid-template-columns:1fr; } .actions { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main id="app"><div class="card">Loading job status...</div></main>
  <script>
    const app = document.getElementById('app');
    const token = new URLSearchParams(location.search).get('token') || '';
    let currentJob = null;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const label = value => String(value || '').replaceAll('_',' ').toLowerCase()
      .replace(/\b\w/g, char => char.toUpperCase());
    const money = paise => new Intl.NumberFormat('en-IN', {
      style:'currency', currency:'INR'
    }).format(Number(paise || 0) / 100);
    const date = value => value ? new Date(value).toLocaleString('en-IN') : '-';
    const formatBytes = value => {
      const bytes = Number(value || 0);
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    };
    const pageSizeSummary = metadata => metadata?.page_size_summary || '';
    const printRequest = metadata => metadata?.customer_print_request || null;

    function pdfAnalysisPanel(attachment) {
      const metadata = attachment.metadata || {};
      const request = printRequest(metadata);
      if (attachment.mime_type !== 'application/pdf') return '';
      return `<div class="tag-row">
        ${attachment.pdf_page_count ? `<span class="tag">Pages ${attachment.pdf_page_count}</span>` : ''}
        ${pageSizeSummary(metadata) ? `<span class="tag">${esc(pageSizeSummary(metadata))}</span>` : ''}
        ${metadata.uniform_page_size ? `<span class="tag">Uniform ${esc(metadata.uniform_page_size)}</span>` : ''}
        ${metadata.has_mixed_page_sizes ? '<span class="tag">Mixed page sizes</span>' : ''}
        ${metadata.portrait_pages ? `<span class="tag">Portrait ${metadata.portrait_pages}</span>` : ''}
        ${metadata.landscape_pages ? `<span class="tag">Landscape ${metadata.landscape_pages}</span>` : ''}
        ${request?.colour_print_active ? '<span class="tag">Colour print active</span>' : ''}
        ${request?.customer_confirmed_total_pages ? `<span class="tag">Confirmed total ${request.customer_confirmed_total_pages}</span>` : ''}
        ${request?.colour_print_active ? `<span class="tag">Colour ${request.customer_confirmed_color_pages || 0}</span>` : ''}
        ${request?.customer_confirmed_bw_pages ? `<span class="tag">B/W ${request.customer_confirmed_bw_pages}</span>` : ''}
        ${request?.customer_page_confirmation ? '<span class="tag">Customer confirmed</span>' : ''}
      </div>`;
    }

    function renderAttachmentPreview(attachment) {
      if (!attachment.content_available) {
        return `<p class="muted">Preview expired. File name and analysis details are retained for this order.</p>`;
      }
      if (String(attachment.mime_type || '').startsWith('image/')) {
        return `<img class="attachment-preview" src="/api/job-portal/${encodeURIComponent(token)}/attachments/${attachment.id}/content" alt="${esc(attachment.file_name)}">`;
      }
      if (attachment.mime_type === 'application/pdf') {
        return '<p class="muted">PDF analyzer checked page count and page sizes. Open the file to review the original document.</p>';
      }
      return '';
    }

    function attachmentCard(attachment) {
      return `<div class="attachment">
        <strong>${esc(attachment.file_name)}</strong>
        ${renderAttachmentPreview(attachment)}
        <div class="tag-row">
          <span class="tag">${esc(attachment.mime_type || 'application/octet-stream')}</span>
          <span class="tag">${esc(formatBytes(attachment.byte_size))}</span>
          ${attachment.pixel_width && attachment.pixel_height ? `<span class="tag">${attachment.pixel_width} x ${attachment.pixel_height}</span>` : ''}
          ${attachment.pdf_page_count ? `<span class="tag">${attachment.pdf_page_count} pages</span>` : ''}
          <span class="tag">${esc(attachment.analysis_status || 'READY')}</span>
          <span class="tag">${attachment.content_available ? 'Preview available' : 'Metadata only'}</span>
        </div>
        ${pdfAnalysisPanel(attachment)}
        <p class="muted">${esc(attachment.analysis_error || (attachment.content_available ? 'Preview is available for review only; no download button is provided.' : 'Physical file was removed after retention.'))}</p>
        ${attachment.content_available ? `<button type="button" onclick="previewAttachment(${attachment.id})">Preview for Review</button>` : ''}
      </div>`;
    }

    function approvalForm(id) {
      return `<div id="approval-${id}">
        <label>Your name</label><input id="name-${id}" autocomplete="name">
        <label>Confirmation method</label><select id="method-${id}">
          <option value="DIGITAL_SIGNATURE">Digital signature</option>
        </select>
        <label>Typed signature / confirmation</label>
        <textarea id="signature-${id}" placeholder="Type your full name and confirmation"></textarea>
        <div class="actions">
          <button onclick="decide(${id},'APPROVED')">Approve Additional Work</button>
          <button class="reject" onclick="decide(${id},'REJECTED')">Reject</button>
        </div></div>`;
    }

    function quotationCard(quotation) {
      if (!quotation) return '';
      return `<section class="card"><h2>Accepted Quotation</h2>
        <p><strong>Total:</strong> ${esc(money(quotation.total_paise))}</p>
        <p><strong>Revision:</strong> ${esc(quotation.revision_no)} | <strong>Status:</strong> ${esc(label(quotation.status))}${quotation.tax_inclusive ? ' | Tax inclusive' : ''}</p>
        ${quotation.lines?.length ? quotation.lines.map(line => `<div class="item">
          <strong>${esc(line.description || '-')}</strong>
          <div>${esc(line.quantity)} ${esc(line.unit || '')} | ${esc(money(line.line_total_paise))}</div>
          ${line.tax_rate ? `<small>Tax ${esc(line.tax_rate)}%</small>` : ''}
        </div>`).join('') : '<p class="muted">No quotation lines available.</p>'}
      </section>`;
    }

    async function load(message = '') {
      try {
        const response = await fetch(`/api/job-portal/${encodeURIComponent(token)}`);
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || 'Unable to open job');
        currentJob = job;
        app.innerHTML = `${message ? `<div class="message">${esc(message)}</div>` : ''}
          <header><small>Tarangini Job Status</small><h1>${esc(job.job_token)}</h1>
            <div class="muted">${esc(job.customer_name)}</div>
            <div class="summary">
              <div><span>Status</span><strong class="status">${esc(label(job.current_status))}</strong></div>
              <div><span>Priority</span><strong>${esc(label(job.priority))}</strong></div>
              <div><span>Promised delivery</span><strong>${esc(date(job.promised_delivery_at))}</strong></div>
            </div></header>
          <section class="card"><h2>Commitment</h2><p>${esc(job.customer_commitment || '-')}</p></section>
          ${job.final_bill_number ? `<section class="card"><h2>Billing Link</h2>
            <p><strong>Invoice:</strong> ${esc(job.final_bill_number)}</p>
            <p><strong>Payment Status:</strong> ${esc(label(job.financial_status || 'OPEN'))}</p>
          </section>` : ''}
          ${quotationCard(job.quotation)}
          <section class="card"><h2>Services</h2>${job.items.map(item => `<div class="item">
            <strong>${esc(item.service_snapshot)}</strong><div>${esc(item.description)}</div>
            <small>${esc(item.quantity)} ${esc(item.unit)}${item.specifications?.notes ? ` | ${esc(item.specifications.notes)}` : ''}</small>
          </div>`).join('')}</section>
          <section class="card"><h2>Shared Files</h2>${job.attachments.length
            ? job.attachments.map(attachmentCard).join('')
            : '<p class="muted">No customer-visible files yet.</p>'}</section>
          <section class="card">
            <h2>Upload Files for Counter / Owner</h2>
            <p class="muted">Images keep original resolution metadata. PDFs run through the customer PDF Analyzer for page count, page-size profile, and original-file validation.</p>
            <label>Select file</label>
            <input id="portal-upload-file" type="file" accept=".pdf,image/jpeg,image/png,image/webp">
            <p id="portal-upload-selection" class="muted upload-note">Accepted: PDF, JPG, PNG, WebP. Original file bytes are stored as uploaded.</p>
            <div id="portal-pdf-analysis" class="muted upload-note"></div>
            <div id="portal-pdf-confirm" class="muted upload-note"></div>
            <label>Purpose</label>
            <select id="portal-upload-purpose">
              <option value="CUSTOMER_UPLOAD">Customer Upload</option>
              <option value="CUSTOMER_APPROVAL_EVIDENCE">Approval Evidence</option>
              <option value="CUSTOMER_REFERENCE">Reference File</option>
            </select>
            <button onclick="uploadAttachment()">Upload File</button>
            <p id="portal-upload-status" class="muted upload-note"></p>
          </section>
          <section class="card"><h2>Additional Work</h2>${job.additions.length ? job.additions.map(addition => `
            <div class="addition ${addition.state === 'AWAITING_CUSTOMER' ? 'awaiting' : ''}">
              <strong>${esc(addition.customer_description)}</strong>
              <div>${esc(addition.quantity)} ${esc(addition.unit)} | ${money(addition.total_paise)}</div>
              <small>${esc(label(addition.state))}</small>
              ${addition.state === 'AWAITING_CUSTOMER' ? approvalForm(addition.id) : ''}
            </div>`).join('') : '<p class="muted">No additional-work requests.</p>'}</section>
          <section class="card"><h2>Progress History</h2>${job.timeline.map(event => `<div class="event">
            <strong>${esc(label(event.to_status))}</strong><div>${esc(event.reason || '')}</div><small>${esc(date(event.occurred_at))}</small>
          </div>`).join('')}</section>
          <div id="preview-modal" class="preview-modal" onclick="closePreview(event)">
            <div class="preview-box" onclick="event.stopPropagation()">
              <button type="button" class="reject" onclick="closePreview()">Close Preview</button>
              <h2 id="preview-title" style="margin-top:12px">File Preview</h2>
              <div id="preview-body"></div>
            </div>
          </div>`;
        bindUploadSelection();
      } catch (error) {
        app.innerHTML = `<div class="card message error">${esc(error.message)}</div>`;
      }
    }

    function previewAttachment(id) {
      const modal = document.getElementById('preview-modal');
      const title = document.getElementById('preview-title');
      const body = document.getElementById('preview-body');
      if (!modal || !title || !body) return;
      const attachment = currentJob?.attachments?.find(file => Number(file.id) === Number(id));
      const name = attachment?.file_name || 'File Preview';
      const mime = attachment?.mime_type || '';
      const src = `/api/job-portal/${encodeURIComponent(token)}/attachments/${id}/content`;
      title.textContent = name || 'File Preview';
      if (mime.startsWith('image/')) {
        body.innerHTML = `<img class="attachment-preview" style="max-height:70vh" src="${src}" alt="${esc(name)}">`;
      } else if (mime === 'application/pdf') {
        body.innerHTML = `<iframe class="preview-frame" src="${src}#toolbar=0&navpanes=0"></iframe>`;
      } else {
        body.innerHTML = `<iframe class="preview-frame" src="${src}"></iframe>`;
      }
      modal.classList.add('open');
    }

    function closePreview(event) {
      if (event && event.target?.id !== 'preview-modal') return;
      const modal = document.getElementById('preview-modal');
      const body = document.getElementById('preview-body');
      if (body) body.innerHTML = '';
      if (modal) modal.classList.remove('open');
    }

    function bindUploadSelection() {
      const input = document.getElementById('portal-upload-file');
      const note = document.getElementById('portal-upload-selection');
      const analysisBox = document.getElementById('portal-pdf-analysis');
      const confirmBox = document.getElementById('portal-pdf-confirm');
      if (!input || !note || input.dataset.bound === '1') return;
      input.dataset.bound = '1';
      input.addEventListener('change', async () => {
        const file = input.files?.[0];
        if (!file) {
          note.textContent = 'Accepted: PDF, JPG, PNG, WebP. Original file bytes are stored as uploaded.';
          if (analysisBox) analysisBox.innerHTML = '';
          if (confirmBox) confirmBox.innerHTML = '';
          return;
        }
        let detail = `${file.name} | ${file.type || 'application/octet-stream'} | ${formatBytes(file.size)}`;
        if ((file.type || '').startsWith('image/')) {
          try {
            const dimensions = await imageDimensions(file);
            detail += ` | ${dimensions.width} x ${dimensions.height}`;
          } catch (_) {}
        }
        if (file.type === 'application/pdf') {
          detail += ' | PDF analyzer will verify page count and page sizes';
          if (analysisBox) {
            analysisBox.innerHTML = '<span class="tag">Analyzing PDF...</span>';
            const analysis = await analyzeSelectedPortalPdf(file, analysisBox);
            if (confirmBox) {
              confirmBox.innerHTML = renderPortalPdfConfirmationCard(analysis);
              syncPortalPdfCounts();
            }
          }
        } else {
          if (analysisBox) analysisBox.innerHTML = '';
          if (confirmBox) confirmBox.innerHTML = '';
        }
        note.textContent = detail;
      });
    }

    function imageDimensions(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          resolve({ width: image.naturalWidth, height: image.naturalHeight });
          URL.revokeObjectURL(url);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Unable to inspect image dimensions'));
        };
        image.src = url;
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
        reader.onerror = () => reject(new Error('Unable to read selected file'));
        reader.readAsDataURL(file);
      });
    }

    function renderPortalPdfConfirmationCard(analysis) {
      const totalPages = Number(analysis?.pdf_page_count || 0) || 1;
      return `<div class="card" style="margin-top:8px;padding:14px">
        <h3 style="margin-bottom:8px">Record Print Requirement</h3>
        <label><input id="portal-pdf-print-active" type="checkbox" style="width:auto;margin-right:8px" onchange="togglePortalPdfPrintRequest()">Colour Print Active</label>
        <div class="tag-row" style="margin-top:8px">
          <span class="tag">Analyzed pages ${esc(totalPages)}</span>
        </div>
        <div class="actions" style="margin-top:8px">
          <div><label>Confirmed Total Pages</label><input id="portal-pdf-total" type="number" min="1" step="1" value="${esc(totalPages)}" onchange="syncPortalPdfCounts()"></div>
          <div><label>Colour Pages</label><input id="portal-pdf-color" type="number" min="0" step="1" value="0" onchange="syncPortalPdfCounts()" disabled></div>
        </div>
        <div class="actions" style="margin-top:8px">
          <div><label>B/W Pages</label><input id="portal-pdf-bw" type="number" min="0" step="1" value="${esc(totalPages)}" readonly></div>
          <div><label>Confirmation</label><label><input id="portal-pdf-confirmed" type="checkbox" style="width:auto;margin-right:8px">I confirm these page counts</label></div>
        </div>
        <label>Notes for Operator</label>
        <textarea id="portal-pdf-notes" placeholder="Optional note about color pages, cover pages, duplex, or special print instructions"></textarea>
      </div>`;
    }

    async function analyzeSelectedPortalPdf(file, target) {
      try {
        const contentBase64 = await fileToBase64(file);
        const response = await fetch(`/api/job-portal/${encodeURIComponent(token)}/analyze-upload`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_name: file.name,
            mime_type: file.type || 'application/octet-stream',
            content_base64: contentBase64
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'PDF analysis failed');
        const analysis = result.analysis || {};
        const metadata = analysis.metadata || {};
        target.innerHTML = `<div class="tag-row">
          <span class="tag">PDF Analyzer ${esc(analysis.analysis_status || 'READY')}</span>
          ${analysis.pdf_page_count ? `<span class="tag">${analysis.pdf_page_count} pages</span>` : ''}
          ${pageSizeSummary(metadata) ? `<span class="tag">${esc(pageSizeSummary(metadata))}</span>` : ''}
          ${metadata.uniform_page_size ? `<span class="tag">Uniform ${esc(metadata.uniform_page_size)}</span>` : ''}
          ${metadata.has_mixed_page_sizes ? '<span class="tag">Mixed page sizes</span>' : ''}
        </div>
        <p class="muted">${esc(analysis.analysis_error || 'PDF structure looks readable and the original bytes will be stored unchanged.')}</p>`;
        return analysis;
      } catch (error) {
        target.innerHTML = `<p class="muted error">${esc(error.message)}</p>`;
        return null;
      }
    }

    function togglePortalPdfPrintRequest() {
      const enabled = document.getElementById('portal-pdf-print-active')?.checked;
      const colorInput = document.getElementById('portal-pdf-color');
      if (colorInput) colorInput.disabled = !enabled;
      syncPortalPdfCounts();
    }

    function syncPortalPdfCounts() {
      const enabled = document.getElementById('portal-pdf-print-active')?.checked;
      const totalInput = document.getElementById('portal-pdf-total');
      const colorInput = document.getElementById('portal-pdf-color');
      const bwInput = document.getElementById('portal-pdf-bw');
      if (!totalInput || !colorInput || !bwInput) return;
      let total = Math.max(1, Number(totalInput.value || 1));
      let color = Math.max(0, Number(colorInput.value || 0));
      if (!enabled) {
        colorInput.value = '0';
        bwInput.value = String(total);
        return;
      }
      if (color > total) {
        color = total;
        colorInput.value = String(color);
      }
      bwInput.value = String(Math.max(0, total - color));
    }

    function portalPdfPrintRequest() {
      const totalInput = document.getElementById('portal-pdf-total');
      const colorInput = document.getElementById('portal-pdf-color');
      const bwInput = document.getElementById('portal-pdf-bw');
      const printActive = document.getElementById('portal-pdf-print-active');
      const confirmed = document.getElementById('portal-pdf-confirmed');
      const notes = document.getElementById('portal-pdf-notes');
      if (!totalInput || !colorInput || !bwInput || !printActive || !confirmed) return null;
      return {
        colour_print_active: Boolean(printActive.checked),
        customer_confirmed_total_pages: Number(totalInput.value || 0),
        customer_confirmed_color_pages: Number(colorInput.value || 0),
        customer_confirmed_bw_pages: Number(bwInput.value || 0),
        customer_page_confirmation: Boolean(confirmed.checked),
        confirmation_notes: notes?.value?.trim() || ''
      };
    }

    async function uploadAttachment() {
      const fileInput = document.getElementById('portal-upload-file');
      const status = document.getElementById('portal-upload-status');
      const file = fileInput?.files?.[0];
      if (!file) {
        status.textContent = 'Choose a PDF, JPG, PNG, or WebP file first.';
        return;
      }
      status.textContent = 'Uploading...';
      try {
        const form = new FormData();
        form.append('file', file, file.name);
        form.append('purpose', document.getElementById('portal-upload-purpose').value);
        const printRequest = portalPdfPrintRequest();
        if (printRequest) form.append('customer_pdf_print_request', JSON.stringify(printRequest));
        const response = await fetch(`/api/job-portal/${encodeURIComponent(token)}/uploads-multipart`, {
          method: 'POST',
          body: form
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Upload failed');
        status.textContent = `Uploaded ${result.attachment.file_name}. Size ${formatBytes(result.attachment.byte_size)}.` +
          (result.attachment.pixel_width && result.attachment.pixel_height ? ` Resolution ${result.attachment.pixel_width} x ${result.attachment.pixel_height}.` : '') +
          (result.attachment.pdf_page_count ? ` PDF pages ${result.attachment.pdf_page_count}.` : '') +
          (result.attachment.metadata?.page_size_summary ? ` Page sizes ${result.attachment.metadata.page_size_summary}.` : '');
        fileInput.value = '';
        const selection = document.getElementById('portal-upload-selection');
        const analysisBox = document.getElementById('portal-pdf-analysis');
        const confirmBox = document.getElementById('portal-pdf-confirm');
        if (selection) {
          selection.textContent = 'Accepted: PDF, JPG, PNG, WebP. Original file bytes are stored as uploaded.';
        }
        if (analysisBox) analysisBox.innerHTML = '';
        if (confirmBox) confirmBox.innerHTML = '';
        await load('Your file was uploaded successfully.');
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function decide(id, decision) {
      const approverName = document.getElementById(`name-${id}`).value.trim();
      const confirmation = document.getElementById(`signature-${id}`).value.trim();
      if (!approverName || !confirmation) return alert('Enter your name and confirmation.');
      const response = await fetch(`/api/job-portal/${encodeURIComponent(token)}/additions/${id}/decision`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          decision, method:document.getElementById(`method-${id}`).value,
          approver_name:approverName, signature_data:confirmation,
          confirmation_text:`${decision} by ${approverName}`
        })
      });
      const result = await response.json();
      if (!response.ok) return alert(result.error || 'Unable to record decision');
      load(`Your decision was recorded: ${label(decision)}.`);
    }

    load();
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
